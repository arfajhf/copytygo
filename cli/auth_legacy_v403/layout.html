{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.AppName}}</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh}a{color:#4254d8;text-underline-offset:3px}button,input{font:inherit}button,a,input{outline-offset:4px}:focus-visible{outline:3px solid #8391ff}.shell{max-width:1160px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;color:#172033;font-weight:750}.logo{width:35px;height:35px;background:#4254d8;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:13px}.home{font-size:14px;color:#536079}.workspace{min-height:calc(100vh - 126px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:80px;padding:58px 42px}.intro{max-width:440px}.eyebrow{color:#4254d8;font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:750}.intro h1{overflow-wrap:anywhere;font-size:clamp(38px,4vw,54px);letter-spacing:-.045em;line-height:1.12;margin:19px 0}.intro p{color:#61708b;line-height:1.8;font-size:16px}.intro .note{margin-top:32px;padding-top:24px;border-top:1px solid #dce2ed;font-size:13px}.card{background:#fff;border:1px solid #e1e6ef;padding:34px;border-radius:20px;box-shadow:0 16px 48px #17203308;max-width:450px;width:100%}.card h2{overflow-wrap:anywhere;font-size:26px;letter-spacing:-.025em;margin:0 0 9px}.subtitle{color:#63718a;line-height:1.6;font-size:14px;margin:0 0 26px}.field{margin:0 0 19px}label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}input:not([type=hidden]){width:100%;border:1px solid #ccd4e2;border-radius:9px;padding:12px 13px;background:#fff;color:#172033;font-size:15px}input[aria-invalid=true]{border-color:#c53b45}.password{display:flex;border:1px solid #ccd4e2;border-radius:9px;overflow:hidden}.password:focus-within{outline:3px solid #8391ff;outline-offset:3px}.password input:not([type=hidden]){border:0;min-width:0;outline:none}.toggle{border:0;background:transparent;font-size:12px;font-weight:650;color:#52617d;padding:0 13px;cursor:pointer}.hint{display:block;color:#63718a;font-size:12px;margin-top:7px}.error{display:block;color:#b32333;font-size:12px;line-height:1.6;margin:6px 0 0}.notice{border:1px solid #efc8ce;background:#fff4f5;border-radius:9px;color:#a01d2b;font-size:14px;line-height:1.6;padding:12px;margin-bottom:22px}.submit{width:100%;border:0;background:#4254d8;color:#fff;padding:13px;border-radius:9px;font-size:14px;font-weight:650;cursor:pointer}.submit:hover{background:#3345c5}.submit:disabled{opacity:.65;cursor:wait}.switch{font-size:13px;color:#63718a;text-align:center;margin:24px 0 0;line-height:1.7}.switch a{font-weight:650}.details{margin:25px 0}.details div{padding:12px 0;border-top:1px solid #edf0f5}.details dt{font-size:12px;color:#63718a;margin-bottom:5px}.details dd{margin:0;font-size:15px;overflow-wrap:anywhere}.success{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:#23714d;background:#edf8f1;border-radius:999px;padding:7px 10px;margin-bottom:18px}.success:before{content:"";width:6px;height:6px;border-radius:50%;background:#23714d}@media(max-width:760px){.shell{padding:22px}.workspace{grid-template-columns:1fr;gap:28px;padding:38px 0;min-height:auto}.intro{max-width:450px;margin:auto;width:100%}.intro h1{overflow-wrap:anywhere;font-size:34px;margin:12px 0}.intro .note{display:none}.card{margin:auto;padding:27px}.intro p{font-size:14px;margin-bottom:0}.home{font-size:12px}.brand{font-size:14px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a class="brand" href="/"><span class="logo" aria-hidden="true">CT</span>{{.AppName}}</a><a class="home" href="/">Back to home</a></header>
<main class="workspace">
<section class="intro"><div class="eyebrow">Your account</div><h1>Welcome to<br>{{.AppName}}</h1><p>Log in to continue, or create an account in a few steps.</p><p class="note">Built with CopyTyGo.</p></section>
<section class="card" aria-labelledby="page-title">
{{if .Message}}<div class="notice" role="alert">{{.Message}}</div>{{end}}
{{template "content" .}}
</section>
</main></div>
<script>
document.querySelectorAll('[data-toggle-password]').forEach(function(button) {
  button.addEventListener('click', function() {
    var input = document.getElementById(button.getAttribute('aria-controls'));
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    button.textContent = show ? 'Hide' : 'Show';
    button.setAttribute('aria-pressed', String(show));
  });
});
var invalid = document.querySelector('[aria-invalid="true"]');
if (invalid) invalid.focus();
document.querySelectorAll('form').forEach(function(form) {
  form.addEventListener('submit', function() {
    var button = form.querySelector('[type="submit"]');
    button.disabled = true;
    button.textContent = button.getAttribute('data-loading-label') || 'Please wait…';
    form.setAttribute('aria-busy', 'true');
  });
});
</script>
</body></html>{{end}}
