name: CopyTyGo Release

on:
  push:
    branches:
      - main
    paths:
      - "version/version.go"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: copytygo-final-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read framework version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^const Framework = "\([^"]*\)"/\1/p' version/version.go)"

          if [ -z "$VERSION" ]; then
            echo "Unable to read Framework version from version/version.go"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing automatic final release for non-final version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for CI on this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            RESULT="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "waiting" else "\(.status) \(.conclusion)" end')"
            if [ "$RESULT" = "completed success" ]; then
              exit 0
            fi
            if [[ "$RESULT" == completed* ]]; then
              echo "Refusing release because CI did not pass: $RESULT"
              exit 1
            fi
            echo "Waiting for CI: $RESULT"
            sleep 10
          done
          echo "CI did not finish within the release timeout."
          exit 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect tag and release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "tag_sha=" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate existing immutable tag
        if: steps.existing.outputs.tag_exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TAG_SHA: ${{ steps.existing.outputs.tag_sha }}
        shell: bash
        run: |
          # A failed release may be retried after changing this workflow only.
          # Go module tags must never move, even before a GitHub release exists.
          git merge-base --is-ancestor "$TAG_SHA" "$GITHUB_SHA"
          if ! git diff --quiet "$TAG_SHA" "$GITHUB_SHA" -- . ':!.github/workflows/release.yml'; then
            echo "Refusing release: $TAG differs from main outside the release workflow."
            echo "Use a new framework version; existing Go module tags are immutable."
            exit 1
          fi

      - name: Create tag
        if: >
          steps.existing.outputs.release_exists != 'true' &&
          steps.existing.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "CopyTyGo $TAG"
          git push origin "refs/tags/$TAG"

      - name: Verify installation from release tag
        if: steps.existing.outputs.release_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TMP="$(mktemp -d)"
          export GOBIN="$TMP/bin"
          # Fetch the just-created tag directly, without waiting for proxy indexing.
          export GOPROXY=direct
          go install "github.com/arfajhf/copytygo/v4/cmd/ctg@$TAG"
          CTG="$GOBIN/ctg"
          test "$("$CTG" version)" = "CopyTyGo v$VERSION"
          cd "$TMP"
          "$CTG" new release-smoke
          cd release-smoke
          grep -q "require github.com/arfajhf/copytygo/v4 $TAG" go.mod
          if grep -q '^replace ' go.mod; then
            echo "Release smoke must not use a local module replacement."
            exit 1
          fi
          go mod tidy
          "$CTG" make:job SendWelcomeEmail
          "$CTG" make:listener NotifyAdmin
          "$CTG" make:seeder UserSeeder
          "$CTG" make:factory User
          "$CTG" make:mail Welcome
          go test ./...
          "$CTG" build
          "$CTG" doctor
          sed -i 's/^APP_PORT=.*/APP_PORT=18083/' .env
          ./build/app > "$TMP/application.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          READY=false
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18083/ > "$TMP/welcome.html"; then
              READY=true
              break
            fi
            sleep 0.5
          done
          if [ "$READY" != true ]; then
            cat "$TMP/application.log"
            exit 1
          fi
          grep -q 'CopyTyGo' "$TMP/welcome.html"
          curl -fsS http://127.0.0.1:18083/__copytygo > "$TMP/studio.html"
          grep -q 'CopyTyGo' "$TMP/studio.html"

          # Verify the published tag's TS auth scaffold and production bundle.
          kill "$APP_PID"
          wait "$APP_PID" || true
          "$CTG" install:auth multi
          test ! -d app/auth/views
          test -f frontend/src/auth/views.ts
          "$CTG" build
          test -f build/frontend/dist/auth.html
          AUTH_APP_KEY="$(sed -n 's/^APP_KEY=//p' .env)"
          (cd build && APP_ENV=production APP_PORT=18084 APP_KEY="$AUTH_APP_KEY" exec ./app) > "$TMP/auth-application.log" 2>&1 &
          APP_PID=$!
          READY=false
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18084/login > "$TMP/auth.html"; then
              READY=true
              break
            fi
            sleep 0.5
          done
          if [ "$READY" != true ]; then
            cat "$TMP/auth-application.log"
            exit 1
          fi
          AUTH_SCRIPT="$(sed -n 's/.*src="\([^"]*assets\/auth[^"]*\.js\)".*/\1/p' "$TMP/auth.html")"
          test -n "$AUTH_SCRIPT"
          curl -fsS "http://127.0.0.1:18084$AUTH_SCRIPT" > "$TMP/auth.js"
          grep -q '/api/session' "$TMP/auth.js"
          curl -fsS http://127.0.0.1:18084/api/session > "$TMP/session.json"
          jq -e '.csrf != "" and .user == null' "$TMP/session.json"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18084/__copytygo)" = "404"

      - name: Create GitHub release
        if: steps.existing.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG"             --title "CopyTyGo v$VERSION"             --generate-notes

      - name: Summary
        shell: bash
        run: |
          echo "CopyTyGo release workflow finished."
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Commit: $GITHUB_SHA"
