name: CopyTyGo CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test, vet and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Build CLI Linux
        run: go build -o build/ctg ./cmd/ctg

      - name: Build CLI Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o build/ctg.exe ./cmd/ctg

      - name: Smoke test generated application
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          cp build/ctg "$TMP/ctg"
          cd "$TMP"

          ./ctg new smoke-app
          cd smoke-app

          go mod edit -replace=github.com/arfajhf/copytygo/v4="$ROOT"
          go mod tidy
          "$TMP/ctg" make:job SendWelcomeEmail
          "$TMP/ctg" make:listener NotifyAdmin
          "$TMP/ctg" make:seeder UserSeeder
          "$TMP/ctg" make:factory User
          "$TMP/ctg" make:mail Welcome
          go test ./...
          mkdir -p build
          go build -o build/smoke-app ./cmd/app

          test -f build/smoke-app
          test -f app/jobs/registry.go
          test -f routes/web.go
          grep -q 'queue.AttachConfigured(app)' cmd/app/main.go
          grep -q 'studio.Register(app)' cmd/app/main.go

  frontend-smoke:
    name: Frontend starter (${{ matrix.frontend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend:
          - typescript
          - react
          - vue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CLI
        run: go build -o build/ctg ./cmd/ctg

      - name: Generate and build frontend preset
        shell: bash
        run: |
          TMP="$(mktemp -d)"
          cp build/ctg "$TMP/ctg"
          cd "$TMP"

          printf 'mysql\nnone\n${{ matrix.frontend }}\nyes\n' | ./ctg new frontend-smoke --interactive

          cd frontend-smoke/frontend
          npm install --no-audit --no-fund
          npm run build


  mysql-integration:
    name: MySQL durable queue
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: copytygo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      COPYTYGO_INTEGRATION_DB: "1"
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: copytygo
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: MySQL queue integration
        run: go test ./integration -run TestDurableQueueIntegration -v

  postgres-integration:
    name: PostgreSQL durable queue
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copytygo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d copytygo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      COPYTYGO_INTEGRATION_DB: "1"
      DB_DRIVER: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: copytygo
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: PostgreSQL queue integration
        run: go test ./integration -run TestDurableQueueIntegration -v


  windows-smoke:
    name: Windows Native and Lite smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -o build\ctg.exe .\cmd\ctg

      - name: Fresh project smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $tmp = Join-Path $env:RUNNER_TEMP "copytygo-windows-smoke"
          if (Test-Path $tmp) {
            Remove-Item -Recurse -Force $tmp
          }
          New-Item -ItemType Directory -Force $tmp | Out-Null

          $ctg = Join-Path $tmp "ctg.exe"
          Copy-Item (Join-Path $root "build\ctg.exe") $ctg

          Set-Location $tmp
          & $ctg new windows-smoke

          Set-Location (Join-Path $tmp "windows-smoke")
          go mod edit "-replace=github.com/arfajhf/copytygo/v4=$root"
          go mod tidy
          go test ./...

          New-Item -ItemType Directory -Force build | Out-Null
          go build -o build\app.exe .\cmd\app

          & $ctg doctor

          function Set-EnvValue([string]$Key, [string]$Value) {
            $lines = Get-Content .env
            $pattern = "^" + [regex]::Escape($Key) + "=.*$"
            if ($lines -match $pattern) {
              $lines = $lines -replace $pattern, ($Key + "=" + $Value)
            } else {
              $lines += ($Key + "=" + $Value)
            }
            Set-Content .env $lines
          }

          function Wait-Http([string]$Url, [int]$Expected = 200) {
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $response = Invoke-WebRequest -Uri $Url -SkipHttpErrorCheck -TimeoutSec 2
                if ([int]$response.StatusCode -eq $Expected) {
                  return $response
                }
              } catch {
              }
              Start-Sleep -Milliseconds 500
            }
            throw "Timed out waiting for $Url with status $Expected"
          }

          # Native Runtime smoke
          Set-EnvValue "APP_ENV" "local"
          Set-EnvValue "APP_PORT" "18080"
          $native = Start-Process -FilePath (Join-Path (Get-Location) "build\app.exe") -PassThru -WorkingDirectory (Get-Location)
          try {
            $welcome = Wait-Http "http://127.0.0.1:18080/" 200
            if ($welcome.Content -notmatch "CopyTyGo") {
              throw "Native welcome page did not render CopyTyGo"
            }

            $studio = Wait-Http "http://127.0.0.1:18080/__copytygo" 200
            if ($studio.Content -notmatch "CopyTyGo") {
              throw "Native Studio did not render"
            }
          } finally {
            if ($native -and -not $native.HasExited) {
              Stop-Process -Id $native.Id -Force
            }
          }

          # Lite Runtime smoke
          Set-EnvValue "APP_ENV" "local"
          Set-EnvValue "APP_PORT" "18081"
          $lite = Start-Process -FilePath $ctg -ArgumentList @("dev","--lite") -PassThru -WorkingDirectory (Get-Location)
          try {
            $welcomeLite = Wait-Http "http://127.0.0.1:18081/" 200
            if ($welcomeLite.Content -notmatch "CopyTyGo") {
              throw "Lite welcome page did not render CopyTyGo"
            }

            $studioLite = Wait-Http "http://127.0.0.1:18081/__copytygo" 200
            if ($studioLite.Content -notmatch "CopyTyGo") {
              throw "Lite Studio did not render"
            }
          } finally {
            if ($lite -and -not $lite.HasExited) {
              Stop-Process -Id $lite.Id -Force
            }
          }

          # Production safety: Studio must be unavailable.
          Set-EnvValue "APP_ENV" "production"
          Set-EnvValue "APP_DEBUG" "false"
          Set-EnvValue "APP_PORT" "18082"
          $production = Start-Process -FilePath (Join-Path (Get-Location) "build\app.exe") -PassThru -WorkingDirectory (Get-Location)
          try {
            Wait-Http "http://127.0.0.1:18082/" 200 | Out-Null
            $studioProduction = Wait-Http "http://127.0.0.1:18082/__copytygo" 404
            if ([int]$studioProduction.StatusCode -ne 404) {
              throw "Studio must return 404 in production"
            }
          } finally {
            if ($production -and -not $production.HasExited) {
              Stop-Process -Id $production.Id -Force
            }
          }

          # Simulate a Windows policy refusal and verify plain `ctg dev` remembers it.
          $fakeBin = Join-Path $tmp "policy-go"
          New-Item -ItemType Directory -Force $fakeBin | Out-Null
          $fakeSource = Join-Path $fakeBin "main.go"
          @'
          package main
          import (
            "fmt"
            "os"
          )
          func main() {
            f, err := os.OpenFile(os.Getenv("COPYTYGO_TEST_GO_COUNT_FILE"), os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0600)
            if err != nil { panic(err) }
            fmt.Fprintln(f, "native attempted")
            f.Close()
            fmt.Fprintln(os.Stderr, "fork/exec C:\\blocked\\app.exe: An Application Control policy has blocked this file.")
            os.Exit(1)
          }
          '@ | Set-Content $fakeSource
          go build -o (Join-Path $fakeBin "go.exe") $fakeSource
          if ($LASTEXITCODE -ne 0) { throw "Unable to build policy simulator" }

          $originalPath = $env:PATH
          $originalCache = $env:LOCALAPPDATA
          $env:COPYTYGO_TEST_GO_COUNT_FILE = Join-Path $tmp "native-attempts.txt"
          $env:LOCALAPPDATA = Join-Path $tmp "runtime-cache"
          $env:PATH = $fakeBin + [IO.Path]::PathSeparator + $env:PATH
          try {
            Set-EnvValue "APP_ENV" "local"
            Set-EnvValue "APP_DEBUG" "true"
            Set-EnvValue "APP_PORT" "18084"
            $policyOut = Join-Path $tmp "policy-first.out"
            $policyErr = Join-Path $tmp "policy-first.err"
            $policy = Start-Process -FilePath $ctg -ArgumentList @("dev") -PassThru -WorkingDirectory (Get-Location) -RedirectStandardOutput $policyOut -RedirectStandardError $policyErr
            try {
              Wait-Http "http://127.0.0.1:18084/" 200 | Out-Null
              Wait-Http "http://127.0.0.1:18084/__copytygo" 200 | Out-Null
            } finally {
              if ($policy -and -not $policy.HasExited) { Stop-Process -Id $policy.Id -Force }
            }
            if ((Get-Content $policyErr -Raw) -match "fork/exec") { throw "Policy fallback printed a raw failure" }

            & $ctg install:auth multi
            if ($LASTEXITCODE -ne 0) { throw "Auth installation failed" }
            Set-EnvValue "APP_PORT" "18085"
            $rememberedOut = Join-Path $tmp "policy-remembered.out"
            $remembered = Start-Process -FilePath $ctg -ArgumentList @("dev") -PassThru -WorkingDirectory (Get-Location) -RedirectStandardOutput $rememberedOut -RedirectStandardError (Join-Path $tmp "policy-remembered.err")
            try {
              Wait-Http "http://127.0.0.1:18085/" 200 | Out-Null
              Wait-Http "http://127.0.0.1:18085/api/auth/me" 401 | Out-Null
              foreach ($endpoint in @("login", "register")) {
                $response = Invoke-WebRequest -Uri ("http://127.0.0.1:18085/api/auth/" + $endpoint) -Method Post -Body '{}' -ContentType 'application/json' -SkipHttpErrorCheck
                if ([int]$response.StatusCode -ne 422) { throw "Auth route $endpoint was not available after runtime fallback" }
              }
            } finally {
              if ($remembered -and -not $remembered.HasExited) { Stop-Process -Id $remembered.Id -Force }
            }
            if (@(Get-Content $env:COPYTYGO_TEST_GO_COUNT_FILE).Count -ne 1) { throw "Plain ctg dev retried the blocked executable after installing auth" }
            if ((Get-Content $rememberedOut -Raw) -notmatch "Using Lite Runtime automatically") { throw "Remembered runtime was not used" }
          } finally {
            $env:PATH = $originalPath
            $env:LOCALAPPDATA = $originalCache
            Remove-Item Env:COPYTYGO_TEST_GO_COUNT_FILE
          }
