name: CopyTyGo CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test, vet and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Build CLI Linux
        run: go build -o build/ctg ./cmd/ctg

      - name: Build CLI Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o build/ctg.exe ./cmd/ctg
