name: CopyTyGo CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test, vet and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Build CLI Linux
        run: go build -o build/ctg ./cmd/ctg

      - name: Build CLI Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o build/ctg.exe ./cmd/ctg

      - name: Smoke test generated application
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          cp build/ctg "$TMP/ctg"
          cd "$TMP"

          ./ctg new smoke-app
          cd smoke-app

          go mod edit -replace=github.com/arfajhf/copytygo/v4="$ROOT"
          go mod tidy
          go test ./...
          mkdir -p build
          go build -o build/smoke-app ./cmd/app

          test -f build/smoke-app
          test -f app/jobs/registry.go
          test -f routes/web.go
          grep -q 'queue.AttachConfigured(app)' cmd/app/main.go
          grep -q 'studio.Register(app)' cmd/app/main.go
