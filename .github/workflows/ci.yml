name: CopyTyGo CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test, vet and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Build CLI Linux
        run: go build -o build/ctg ./cmd/ctg

      - name: Build CLI Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o build/ctg.exe ./cmd/ctg

      - name: Smoke test generated application
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          cp build/ctg "$TMP/ctg"
          cd "$TMP"

          ./ctg new smoke-app
          cd smoke-app

          go mod edit -replace=github.com/arfajhf/copytygo/v4="$ROOT"
          go mod tidy
          go test ./...
          mkdir -p build
          go build -o build/smoke-app ./cmd/app

          test -f build/smoke-app
          test -f app/jobs/registry.go
          test -f routes/web.go
          grep -q 'queue.AttachConfigured(app)' cmd/app/main.go
          grep -q 'studio.Register(app)' cmd/app/main.go

  frontend-smoke:
    name: Frontend starter (${{ matrix.frontend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend:
          - typescript
          - react
          - vue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CLI
        run: go build -o build/ctg ./cmd/ctg

      - name: Generate and build frontend preset
        shell: bash
        run: |
          TMP="$(mktemp -d)"
          cp build/ctg "$TMP/ctg"
          cd "$TMP"

          printf 'mysql\nnone\n${{ matrix.frontend }}\nyes\n' | ./ctg new frontend-smoke --interactive

          cd frontend-smoke/frontend
          npm install --no-audit --no-fund
          npm run build


  mysql-integration:
    name: MySQL durable queue
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: copytygo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      COPYTYGO_INTEGRATION_DB: "1"
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: copytygo
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: MySQL queue integration
        run: go test ./integration -run TestDurableQueueIntegration -v

  postgres-integration:
    name: PostgreSQL durable queue
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copytygo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d copytygo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      COPYTYGO_INTEGRATION_DB: "1"
      DB_DRIVER: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: copytygo
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: PostgreSQL queue integration
        run: go test ./integration -run TestDurableQueueIntegration -v
