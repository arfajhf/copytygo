{{define "content"}}
<h2 id="page-title">Welcome back</h2>
<p class="subtitle">Enter your email and password to log in.</p>
<form method="post" action="/login">
<input type="hidden" name="_token" value="{{.CSRF}}">
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="{{.Email}}" placeholder="you@example.com" required autofocus aria-invalid="{{if index .Errors "email"}}true{{else}}false{{end}}" aria-describedby="email-error">{{with index .Errors "email"}}<div class="error" id="email-error">{{range .}}<div>Email {{.}}</div>{{end}}</div>{{end}}</div>
<div class="field"><label for="password">Password</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" aria-invalid="{{if index .Errors "password"}}true{{else}}false{{end}}" aria-describedby="password-error"><button class="toggle" type="button" data-toggle-password aria-controls="password" aria-pressed="false" aria-label="Show or hide password">Show</button></div>{{with index .Errors "password"}}<div class="error" id="password-error">{{range .}}<div>Password {{.}}</div>{{end}}</div>{{end}}</div>
<button class="submit" type="submit" data-loading-label="Logging in…">Log in</button>
</form>
<p class="switch">New here? <a href="/register">Create an account</a></p>
{{end}}
