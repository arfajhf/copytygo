{{define "content"}}
<div class="heading"><div><div class="eyebrow">Your profile</div><h1>My account</h1><p class="subtitle">Your current account details.</p></div></div>
<section class="panel form-panel">{{if .Message}}<div class="notice" role="alert">{{.Message}}</div>{{end}}<h2>{{.Name}}</h2><dl class="details"><div><dt>Name</dt><dd>{{.Name}}</dd></div><div><dt>Email address</dt><dd>{{.Email}}</dd></div>{{if .Role}}<div><dt>Role</dt><dd>{{.Role}}</dd></div>{{end}}</dl><a class="btn" href="/dashboard">Back to dashboard</a></section>
{{end}}
