{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}} · {{.AppName}}</title><link rel="icon" href="{{.LogoURL}}">
<style>

olid #e0e9ed;border-radius:14px}.stat span{display:block;color:#738894;font-size:13px;margin-bottom:12px}.stat strong{font-size:30px;letter-spacing:-.04em}.stat p{font-size:12px;color:#859ba8;margin:9px 0 0}.btn{display:inline-block;border:0;background:#087e88;color:#fff;border-radius:8px;padding:11px 16px;text-decoration:none;font-weight:650;font-size:13px;cursor:pointer;white-space:nowrap}.secondary{background:#eef4f6;color:#3c5668}.details{margin:20px 0}.details div{padding:13px 0;border-top:1px solid #edf2f4}.details dt{color:#6f8492;font-size:12px;margin-bottom:5px}.details dd{margin:0;font-size:14px;overflow-wrap:anywhere}.notice{background:#fff0f1;border:1px solid #f0c9ce;color:#a92e3e;border-radius:9px;padding:13px 16px;font-size:14px;line-height:1.6;margin:0 0 22px}.success{background:#edf8f2;border:1px solid #c9e8d7;color:#26754e;border-radius:9px;padding:13px 16px;font-size:14px;margin:0 0 22px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.search{display:flex;gap:8px;max-width:440px;flex:1}.search input{min-width:0;flex:1}input:not([type=hidden]),select{width:100%;padding:11px 12px;border:1px solid #cddce2;border-radius:8px;background:#fff;color:#172c3e;font-size:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#7b91a0;background:#f7fafb}th,td{padding:15px 13px;border-bottom:1px solid #e8eff2}td{font-size:13px}.user-name{font-weight:650;margin-bottom:4px}.user-email{color:#7a8f9d;font-size:12px}.row-actions{display:flex;align-items:center;justify-content:flex-end;gap:14px}.row-actions form{margin:0}.delete{border:0;background:transparent;color:#ba3f50;padding:0;cursor:pointer;font-size:12px}.row-actions a{font-size:12px;font-weight:650}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;font-size:12px;color:#7b91a0}.pager nav{display:flex;gap:14px}.empty{text-align:center;padding:44px 20px;color:#6f8492}.form-panel{max-width:620px}.field{margin-bottom:20px}label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}.hint{font-size:12px;color:#7b91a0;display:block;margin-top:7px;line-height:1.6}.error{display:block;color:#b32333;font-size:12px;margin-top:7px}input[aria-invalid=true],select[aria-invalid=true]{border-color:#c23c4d}.form-actions{display:flex;gap:12px;margin-top:28px}.welcome-panel{background:linear-gradient(120deg,#e8f5f2,#f8fbfd);border:1px solid #d9ebe7;border-radius:14px;padding:30px;margin-bottom:24px}.welcome-panel h2{margin:0 0 10px;font-size:22px}.welcome-panel p{max-width:560px;color:#5c7d82;font-size:14px;line-height:1.8}.welcome-panel .btn{margin-top:10px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.eyebrow{color:#08848d;font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;margin-bottom:10px}@media(max-width:760px){table{table-layout:fixed;white-space:normal}th:first-child{width:50%}th:nth-child(2){width:20%}th:last-child{width:30%}th,td{padding:14px 5px}.user-name,.user-email{overflow-wrap:anywhere}.user-email{font-size:11px}.row-actions{flex-direction:column;align-items:flex-end;gap:12px}.role{padding:5px 7px}.top{padding:15px 20px}.brand{gap:8px;font-size:14px}.brand img{width:35px;height:35px}.top-actions{gap:10px}.top-actions>a{display:none}.workspace{grid-template-columns:1fr;gap:22px;padding:23px 20px}.sidebar .label{display:none}.workspace>main{min-width:0}.sidebar nav{display:flex;gap:8px;overflow:auto}.sidebar a{white-space:nowrap;padding:10px 13px;font-size:13px}.stats{gap:10px}.stat{padding:17px 13px}.stat strong{font-size:25px}.stat p{display:none}.heading{align-items:flex-start}h1{font-size:26px}.panel{padding:20px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%;max-width:none}.profile-grid{grid-template-columns:1fr}.welcome-panel{padding:23px}.role{font-size:11px}}
</style></head><body>
<header class="top"><a class="brand" href="/dashboard"><img src="{{.LogoURL}}" alt="CopyTyGo logo">{{.AppName}}</a><div class="top-actions"><a href="/">Home</a><span class="role">{{if .Role}}{{.Role}}{{else}}Member{{end}}</span><form method="post" action="/logout"><input type="hidden" name="_token" value="{{.CSRF}}"><button class="logout" type="submit">Log out</button></form></div></header>
<div class="workspace"><aside class="sidebar"><div class="label">Workspace</div><nav aria-label="Main navigation"><a href="/dashboard" {{if eq .Title "Dashboard"}}aria-current="page"{{end}}>Dashboard</a>{{if .Admin}}<a href="/users" {{if or (eq .Title "Users") (eq .Title "Add user") (eq .Title "Edit user")}}aria-current="page"{{end}}>Users</a>{{end}}<a href="/account" {{if eq .Title "Your account"}}aria-current="page"{{end}}>My account</a></nav></aside><main>{{template "content" .}}</main></div>
<script>
document.querySelectorAll('form[data-confirm]').forEach(form=>form.addEventListener('submit',event=>{if(!confirm(form.dataset.confirm))event.preventDefault()}));const invalid=document.querySelector('[aria-invalid="true"]');if(invalid)invalid.focus();
</script></body></html>{{end}}
